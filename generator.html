<!DOCTYPE html>
<html>
<head>
<title>Generator</title>
</head>

<body style="font-family:Arial;background:#0b1220;color:white;text-align:center;padding:20px">

<h1>🤖 Git Blog Generator</h1>

<input id="title" placeholder="Movie Title" style="width:80%;padding:10px">

<br><br>

<button onclick="generate()" style="padding:10px 20px;background:#22c55e;color:white;border:none">
Generate Article
</button>

<script>
function generate(){

let title=document.getElementById("title").value;

let fileName = title.replaceAll(" ","_")+".html";

let article = `
<!DOCTYPE html>
<html>
<head>
<title>${title} Review</title>
</head>

<body style="font-family:Arial;max-width:800px;margin:auto">

<h1>${title} (2026) Full Review</h1>

<p>${title} is a trending Hollywood movie with strong visuals and engaging story.</p>

<h2>Story</h2>
<p>Movie delivers emotional and action packed storyline.</p>

<h2>Review</h2>
<p>Performance and direction are strong and audience response is positive.</p>

<h2>Final Verdict</h2>
<p>${title} is worth watching for entertainment lovers.</p>

</body>
</html>
`;

// download article file
let blob=new Blob([article],{type:"text/html"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=fileName;
a.click();

// update posts.json locally
alert("Now manually add this to posts.json:\n"+fileName);

}
</script>

</body>
</html>
